[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["mlartifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # longitud de línea: criterio de estilo, no de correctitud

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
