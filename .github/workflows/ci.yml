name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests + quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest (ingesta, features, no-leakage, API, champion, quality gate de F1 macro)
        run: pytest --cov=aqi --cov-report=term-missing

  docker:
    name: Docker build + smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aqi-app:ci .
      - name: Smoke test (/health y /model-info)
        run: |
          docker run -d --name aqi -p 7860:7860 aqi-app:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:7860/health && break || sleep 2
          done
          curl -fs http://localhost:7860/health
          curl -fs http://localhost:7860/model-info
      - name: Container logs (si falla)
        if: failure()
        run: docker logs aqi
