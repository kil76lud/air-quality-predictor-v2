name: Retrain

on:
  schedule:
    - cron: "0 6 * * 1"          # cada lunes 06:00 UTC
  workflow_dispatch:
    inputs:
      n_trials:
        description: "Optuna trials (vacío = config)"
        required: false
        default: ""
      seed:
        description: "Seed (vacío = config)"
        required: false
        default: ""
      min_delta:
        description: "Umbral de promoción de F1 macro (vacío = 0.005). Usar -1.0 solo para demo."
        required: false
        default: ""

permissions:
  contents: write      # commit del modelo/datos
  actions: write       # disparar cd.yml

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt

      - name: 1) Ingesta incremental + validación pandera (con respaldo si la API falla)
        run: python -m aqi.ingest --all

      - name: 2-3) Entrenar challenger y comparar con champion
        id: train
        run: |
          ARGS=""
          [ -n "${{ inputs.n_trials }}" ]  && ARGS="$ARGS --n-trials ${{ inputs.n_trials }}"
          [ -n "${{ inputs.seed }}" ]      && ARGS="$ARGS --seed ${{ inputs.seed }}"
          [ -n "${{ inputs.min_delta }}" ] && ARGS="$ARGS --min-delta ${{ inputs.min_delta }}"
          python -m aqi.train --all $ARGS

      - name: Resumen de la decisión
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print("## Champion / Challenger (por ciudad)")
          for f in sorted(pathlib.Path("models/reports").glob("*/last_run.json")):
              d = json.load(open(f))
              print(f"### {d.get('city', f.parent.name)}")
              print(f"- **Decisión:** {'✅ PROMOVIDO' if d['promoted'] else '⛔ RECHAZADO'}")
              print(f"- **Motivo:** {d['reason']}")
              print(f"- F1 macro challenger: `{d['challenger_f1_macro']:.4f}` | champion: `{d['champion_f1_macro']}` | baseline: `{d['baseline_f1_macro']:.4f}`")
              print(f"- Trials: {d['n_trials']} | seed: {d['seed']} | datos: {d['data_source']}")
          PY

      - name: Pruebas (quality gate sobre el champion resultante)
        run: pytest

      - name: Commit de datos, modelo y bitácora
        id: commit
        run: |
          git config user.name  "retrain-bot"
          git config user.email "retrain-bot@users.noreply.github.com"
          git add data models mlflow.db 2>/dev/null || git add data models
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(retrain): ${{ steps.train.outputs.promoted == 'true' && 'promote new champion' || 'update data/decision log' }} [skip ci]"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy (solo si hubo nuevo champion)
        if: steps.train.outputs.promoted == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cd.yml --ref main
